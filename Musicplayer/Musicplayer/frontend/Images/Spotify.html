<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="Spotify.css">
</head>

<body>
    <div class="logo"><img src="favicon.ico" alt=""></div>
    <div class="spotify">
        <div class="s">S</div>
        <div class="p">p</div>
        <div class="o">o</div>
        <div class="t">t</div>
        <div class="i">i</div>
        <div class="f">f</div>
        <div class="y">y</div>
    </div>
    <div class="left">
        <Section class="upper-section">
            <div class="close"><img class="filter" src="close.svg" alt=""></div>
            <ul>
                <li><img class="filter" src="home1.svg" alt=""><span>Home</span></li>
                <li><img class="filter" src="search.svg" alt=""><span>Search</span></li>
            </ul>
        </Section>
        <section class="lower-section">
            <div class="Library">
                <img class="filter" width="30" src="library.svg" alt=""><span>Your Library</span>
            </div>
            <div class="songlist">
                <ul>
                </ul>
            </div>
            <div class="bottom">
                <ul>
                    <li><a href="">Help</a></li>
                    <li><a href="">Contact Us</a></li>
                    <li><a href="">Report</a></li>
                    <li><a href="">About Us</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">FAQs</a></li>
                </ul>
            </div>
        </section>
    </div>
    <div class="right">
        <nav>
            <div class="svg-container">
                <div><img width="46" class="filter" src="backword1.svg" alt=""></div>
                <div class="hamburger"><img width="30" class="filter" src="hamburger.svg" alt=""></div>
                <div><img width="30" class="filter" src="Forward1.svg" alt=""></div>
            </div>
            <div class="buttons-container">
                <button class="sign-up-btn">Sign up</button>
                <button class="log-in-btn">Log in</button>
            </div>
        </nav>
        <h1>Spotify PLaylists</h1>
        <div class="container">
        </div>
        <div class="playbar">
            <div class="song-info"></div>
            <div class="play-buttons">
                <img width="32" class="filter" id="previous" src="previous1.svg" alt="">
                <img id="play" class="filter" src="play.svg" alt="">
                <img width="30" class="filter" id="next" src="next2.svg" alt="">
            </div>
            <div class="duration"></div>
        </div>
        <div class="seekbar">
            <div class="circle"></div>
        </div>
    </div>
    <!-- <script src="Spotify.js"></script> -->
</body>

</html>
